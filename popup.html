<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <h2 style="position: relative;">
    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#6366f1" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/></svg>
    AnyPNG Pro
    <svg id="settings-btn" style="position: absolute; right: 0; top: 50%; transform: translateY(-50%); cursor: pointer; color: var(--text-muted);" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg>
  </h2>
  
  <div id="error-msg"></div>

  <!-- AUTH SCREEN -->
  <div id="auth-view">
    <div class="input-group">
      <input type="email" id="email" placeholder="Email Address" required>
    </div>
    <div class="input-group">
      <input type="password" id="password" placeholder="Password" required>
    </div>
    <button id="login-btn">
      <span id="login-text">Login</span>
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4M10 17l5-5-5-5M15 12H3"/></svg>
    </button>
    <a class="link" id="toggle-signup">Need an account? Sign Up</a>
  </div>

  <!-- DASHBOARD SCREEN -->
  <div id="dashboard-view" class="hidden">
    <div class="credits-card">
      <div class="credits-label">
        CREDITS REMAINING
        <svg id="refresh-credits-btn" class="refresh-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M23 4v6h-6M1 20v-6h6"/><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/></svg>
      </div>
      <div class="credits-number" id="credit-count">-</div>
    </div>

    <!-- Pro Watermark Section in Popup -->
    <div id="watermark-section" style="margin-bottom: 20px; border-top: 1px solid var(--border); padding-top: 20px;">
        <h3 style="font-size: 14px; margin-bottom: 12px; color: var(--text-muted);">PRO WATERMARK REMOVER</h3>
        <div id="popup-preview-box" style="width: 100%; height: 150px; background: var(--card-bg); border-radius: 8px; display: flex; justify-content: center; align-items: center; overflow: hidden; margin-bottom: 12px; border: 1px solid var(--border);">
            <img id="popup-result-img" style="display: none; max-width: 100%; max-height: 100%; object-fit: contain;" />
            <div id="popup-spinner" class="hidden" style="color: var(--success); font-size: 12px;">Processing...</div>
            <div id="popup-placeholder" style="color: var(--text-muted); font-size: 12px; text-align: center; padding: 10px;">Right-click an image on any site and select "Remove Watermark" to start.</div>
        </div>

        <div id="advanced-prompt-container" class="hidden">
            <textarea id="popup-prompt" rows="2" style="width: 100%; background: var(--bg); border: 1px solid var(--border); color: var(--text); padding: 8px; border-radius: 6px; box-sizing: border-box; font-size: 12px; margin-bottom: 12px;" placeholder="Advanced AI Prompt..."></textarea>
        </div>

        <div style="display: flex; gap: 8px;">
            <button id="popup-retry" disabled class="secondary-btn" style="flex: 1; padding: 8px; font-size: 12px;">🔄 Retry</button>
            <button id="popup-download" disabled style="flex: 1; padding: 8px; font-size: 12px; background: var(--success);">Download</button>
        </div>
    </div>
    
    <button id="buy-btn" style="background: #10b981;">
      <span>Buy More Credits</span>
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
    </button>
    
    <div class="divider"></div>
    
    <button id="logout-btn" class="secondary-btn" style="background: transparent; border: 1px solid #ef4444; color: #ef4444;">
      <span>Logout</span>
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9"/></svg>
    </button>
  </div>

  <script src="popup.js"></script>
</body>
</html>
