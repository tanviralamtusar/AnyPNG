<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="../styles/global.css">
    <link rel="stylesheet" href="../styles/auth.css">
</head>
<body class="animate-fade-in">
    <div class="auth-container">

        <div class="logo-wrapper">
            <img src="../icons/Anypng.png" alt="RightMate Logo" style="width: 48px; height: 48px; margin-bottom: 1rem;">
            <h1>RightMate</h1>
        </div>

        <div class="glass-effect auth-card">
            <div id="signup-step">
                <div class="input-container">
                    <input type="text" id="fullname" placeholder="Full Name" required autocomplete="name">
                    <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                        <circle cx="12" cy="7" r="4"></circle>
                    </svg>
                </div>

                <div class="input-container">
                    <input type="email" id="email" placeholder="Email Address" required autocomplete="email">
                    <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path>
                        <polyline points="22,6 12,13 2,6"></polyline>
                    </svg>
                </div>

                <div class="input-container">
                    <input type="password" id="password" placeholder="Password" required autocomplete="new-password">
                    <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                        <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
                    </svg>
                </div>

                <button id="signup-btn" class="auth-btn">
                    <span>Create Account</span>
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                        <circle cx="12" cy="7" r="4"></circle>
                    </svg>
                </button>
            </div>

            <div id="verify-step" class="hidden">
                <p class="step-hint">
                    We sent a verification code to<br><strong id="verify-email"></strong>
                </p>

                <div class="input-container">
                    <input type="text" id="otp" class="otp-input" placeholder="Code" inputmode="numeric" autocomplete="one-time-code" maxlength="10">
                </div>

                <button id="verify-btn" class="auth-btn">
                    <span>Verify Email</span>
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <polyline points="20 6 9 17 4 12"></polyline>
                    </svg>
                </button>

                <p class="switch-link">
                    Didn't get it? <button id="resend-btn" class="link-btn" type="button">Resend code</button>
                </p>
            </div>

            <div id="error-msg" class="error-message"></div>
            <div id="success-msg" class="success-message"></div>

            <a href="login.html" class="switch-link">
                Already have an account? <span>Login</span>
            </a>
        </div>

        <a class="brand-credit" href="https://oddbirds.dev" target="_blank" rel="noopener">Developed by <strong>oddbirds.dev</strong></a>
    </div>

    <script src="../scripts/signup.js"></script>
</body>
</html>
