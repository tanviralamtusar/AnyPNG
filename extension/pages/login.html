<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="../styles/global.css">
    <link rel="stylesheet" href="../styles/auth.css">
</head>
<body class="animate-fade-in">
    <div class="auth-container">
        
        <div class="logo-wrapper">
            <img src="../icons/Anypng.png" alt="AnyPNG Logo" style="width: 48px; height: 48px; margin-bottom: 1rem;">
            <h1>AnyPNG</h1>
        </div>

        <div class="glass-effect auth-card">
            <div class="input-container">
                <input type="email" id="email" placeholder="Email Address" required autocomplete="email">
                <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path>
                    <polyline points="22,6 12,13 2,6"></polyline>
                </svg>
            </div>
            
            <div class="input-container">
                <input type="password" id="password" placeholder="Password" required autocomplete="current-password">
                <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                    <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
                </svg>
            </div>

            <div id="error-msg" class="error-message"></div>

            <button id="login-btn" class="auth-btn">
                <span>Login</span>
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4M10 17l5-5-5-5M15 12H3"/>
                </svg>
            </button>

            <a href="signup.html" class="switch-link">
                Don't have an account? <span>Sign up</span>
            </a>
        </div>
    </div>

    <script src="../scripts/login.js"></script>
</body>
</html>
