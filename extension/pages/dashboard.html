<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="../styles/global.css">
    <link rel="stylesheet" href="../styles/dashboard.css">
</head>
<body class="animate-fade-in">
    <header class="app-header">
        <div class="logo-container">
            <img src="../icons/Anypng.png" alt="RightMate Logo" class="logo" style="width: 32px; height: 32px;">
            <h2>Right<span class="wordmark-accent">Mate</span></h2>
        </div>
    </header>

    <div id="error-msg"></div>

    <div id="dashboard-view" class="view-container">
        <a id="update-banner" class="update-banner hidden" target="_blank" rel="noopener">
            <span class="update-icon" aria-hidden="true">&#8659;</span>
            <span>
                <strong id="update-title">Update available</strong>
                <span id="update-detail"></span>
            </span>
        </a>

        <div class="glass-effect placeholder-content dashboard-placeholder">
            <p>Use the RightMate right-click menu to convert or upscale images.</p>
        </div>

        <div id="license-card" class="glass-effect placeholder-content dashboard-placeholder license-card">
            <p class="license-line">
                <span class="license-dot" aria-hidden="true"></span>
                <span id="license-summary">Checking your license&hellip;</span>
            </p>
            <p id="license-device"></p>
        </div>
    </div>

    <a class="brand-credit" href="https://oddbirds.dev" target="_blank" rel="noopener">Developed by <strong>oddbirds.dev</strong></a>

    <nav class="bottom-nav">
        <button class="nav-item active" id="nav-home-btn"><span>Home</span></button>
        <button class="nav-item" id="nav-settings-btn"><span>Settings</span></button>
        <button class="nav-item" id="logout-btn"><span>Logout</span></button>
    </nav>

    <script src="../scripts/license.js"></script>
    <script src="../scripts/update.js"></script>
    <script src="../scripts/dashboard.js"></script>
</body>
</html>
