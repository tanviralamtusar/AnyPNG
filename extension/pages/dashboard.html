<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="../styles/global.css">
    <link rel="stylesheet" href="../styles/dashboard.css">
</head>
<body class="animate-fade-in">
    <header class="app-header">
        <div class="logo-container">
            <img src="../icons/Anypng.png" alt="AnyPNG Logo" class="logo" style="width: 32px; height: 32px;">
            <h2>AnyPNG</h2>
        </div>
        <!-- Note: Settings is handled by the bottom nav now, but kept if JS relies on it -->
        <button class="icon-btn hidden" id="settings-btn" aria-label="Settings">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <circle cx="12" cy="12" r="3" />
                <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z" />
            </svg>
        </button>
    </header>

    <div id="error-msg"></div>

    <svg width="0" height="0" class="hidden">
        <defs>
            <linearGradient id="progress-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" stop-color="#60a5fa" />
                <stop offset="100%" stop-color="#2563eb" />
            </linearGradient>
        </defs>
    </svg>

    <div id="dashboard-view" class="view-container">
        <div class="glass-effect credits-card">
            <div class="credits-header">
                <span class="credits-label">CREDITS REMAINING</span>
                <button class="icon-btn minimal" id="refresh-credits-btn" aria-label="Refresh credits">
                    <svg class="refresh-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M23 4v6h-6M1 20v-6h6" />
                        <path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15" />
                    </svg>
                </button>
            </div>
            <div class="credits-number" id="credit-count">-</div>
            <div class="progress-bar-bg">
                <div class="progress-bar-fill accent-glow" id="profile-progress" style="width: 0%;"></div>
            </div>
            <div class="credits-meta">
                <span id="profile-credits-used">0</span>
                <span id="profile-credits-total">/ 100</span>
            </div>
        </div>

        <div id="watermark-section">
            <div id="popup-preview-box" class="glass-effect preview-container">
                <img id="popup-result-img" alt="Preview" />
                
                <div id="popup-spinner" class="hidden spinner-overlay">
                    <div class="blue-spinner"></div>
                </div>
                
                <div id="processing-container" class="hidden glass-effect processing-overlay">
                    <div class="processing-content">
                        <h3 class="processing-title">Removing Watermark</h3>
                        <div class="progress-circle-container">
                            <svg class="progress-ring" width="120" height="120" viewBox="0 0 120 120">
                                <circle class="progress-ring-bg" cx="60" cy="60" r="54" />
                                <circle class="progress-ring-fill blue-ring" cx="60" cy="60" r="54" />
                            </svg>
                            <div class="progress-text-container">
                                <span class="progress-percentage blue-gradient-text">0%</span>
                            </div>
                        </div>
                        <p class="processing-status-text">Detecting subjects...</p>
                        <p class="processing-time">Est. time remaining: 2.1s</p>
                    </div>
                    <button id="popup-cancel" class="cancel-btn">Cancel Processing</button>
                </div>
                
                <div id="popup-placeholder" class="placeholder-content">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                        <rect x="3" y="3" width="18" height="18" rx="2" ry="2" />
                        <circle cx="8.5" cy="8.5" r="1.5" />
                        <polyline points="21 15 16 10 5 21" />
                    </svg>
                    <p>Right-click an image and select "Remove Watermark"</p>
                </div>
            </div>

            <div id="advanced-prompt-container" class="hidden">
                <textarea id="popup-prompt" class="advanced-prompt" rows="2" placeholder="Add custom AI prompt..."></textarea>
                <div class="method-selector">
                    <label>
                        <input type="radio" name="watermark-method" value="standard"> Standard AI
                    </label>
                    <label>
                        <input type="radio" name="watermark-method" value="gemini" checked> Gemini Flash (Vertex AI)
                    </label>
                </div>
            </div>

            <div class="action-column">
                <button id="popup-download" disabled class="btn-primary">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4" />
                        <polyline points="7 10 12 15 17 10" />
                        <line x1="12" y1="15" x2="12" y2="3" />
                    </svg>
                    Download HD
                </button>

                <div class="action-row-secondary">
                    <button id="popup-retry" disabled class="btn-secondary">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <polyline points="23 4 23 10 17 10" />
                            <path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10" />
                        </svg>
                        Retry
                    </button>

                    <button id="buy-btn" class="btn-success">
                        Buy Credits <span class="plus-icon">+</span>
                    </button>
        </div>
      </div>
    </div>
  </div>

  <nav class="bottom-nav">
    <button class="nav-item active" id="nav-home-btn">
      <svg viewBox="0 0 24 24" fill="currentColor">
        <path d="M12 3l9 8h-3v10H6V11H3z" />
      </svg>
      <span>Home</span>
    </button>
    <button class="nav-item" id="nav-settings-btn">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <circle cx="12" cy="12" r="3" />
        <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z" />
      </svg>
      <span>Settings</span>
    </button>
    <button class="nav-item" id="logout-btn">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4" />
        <polyline points="16 17 21 12 16 7" />
        <line x1="21" y1="12" x2="9" y2="12" />
      </svg>
      <span>Logout</span>
    </button>
  </nav>

  <script src="../scripts/dashboard.js"></script>
</body>
</html>
