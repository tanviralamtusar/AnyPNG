<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="../styles/global.css">
    <link rel="stylesheet" href="../styles/dashboard.css">
</head>
<body class="animate-fade-in">
    <header class="app-header">
        <div class="logo-container">
            <img src="../icons/Anypng.png" alt="AnyPNG Logo" class="logo" style="width: 32px; height: 32px;">
            <h2>AnyPNG</h2>
        </div>
    </header>

    <div id="error-msg"></div>

    <div id="dashboard-view" class="view-container">
        <div class="glass-effect placeholder-content dashboard-placeholder">
            <p>Use the AnyPNG right-click menu to convert images or download videos.</p>
        </div>

        <div id="video-section" class="hidden">
            <div class="glass-effect preview-container" id="video-info-box">
                <input type="text" id="video-url-input" placeholder="Video page URL">
                <p id="video-platform-badge" class="processing-status-text">Detecting platform...</p>
                <select id="video-quality-select">
                    <option value="best">Best Quality</option>
                    <option value="1080">1080p</option>
                    <option value="720">720p</option>
                    <option value="480">480p</option>
                    <option value="audio">Audio Only (MP3)</option>
                </select>
                <p id="video-status-line" class="processing-status-text hidden"></p>
            </div>
            <div class="action-column">
                <button id="video-download-btn" class="btn-primary">Download Video</button>
            </div>
        </div>
    </div>

    <nav class="bottom-nav">
        <button class="nav-item active" id="nav-home-btn"><span>Home</span></button>
        <button class="nav-item" id="nav-video-btn"><span>Video</span></button>
        <button class="nav-item" id="nav-settings-btn"><span>Settings</span></button>
        <button class="nav-item" id="logout-btn"><span>Logout</span></button>
    </nav>

    <script src="../scripts/dashboard.js"></script>
</body>
</html>
