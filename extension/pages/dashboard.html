<!DOCTYPE html>
<html lang="en">
<head>

  <link rel="stylesheet" href="../styles/global.css">

<body class="animate-fade-in">

        <div class="quick-copy"><p class="eyebrow">Quick start</p><h2>Use the RightMate <span>right-click menu</span></h2><p>Convert, upscale or enhance images and videos directly from any website.</p></div>
        <div class="cursor-illustration" aria-hidden="true"><svg viewBox="0 0 150 150" fill="none"><defs><linearGradient id="cursorBody" x1="41" y1="31" x2="104" y2="116" gradientUnits="userSpaceOnUse"><stop stop-color="#293445"/><stop offset="1" stop-color="#111722"/></linearGradient><linearGradient id="cursorBlue" x1="87" y1="88" x2="119" y2="124" gradientUnits="userSpaceOnUse"><stop stop-color="#54A0FF"/><stop offset="1" stop-color="#1758F3"/></linearGradient><filter id="cursorGlow" x="0" y="0" width="150" height="150"><feGaussianBlur stdDeviation="7" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs><circle class="ring outer" cx="75" cy="75" r="62"/><circle class="ring" cx="75" cy="75" r="48"/><g filter="url(#cursorGlow)"><path class="cursor-body" d="M43 31.5c-2.7-2-6.5-.1-6.5 3.3v79.4c0 3.8 4.5 5.8 7.3 3.2l18.6-17.1 13.4 30.2c1 2.4 3.9 3.4 6.2 2.2l16.5-8.4c2.1-1.1 3-3.7 1.9-5.8L85.7 90.2l24.7-2.8c3.8-.4 5.1-5.4 2-7.7L43 31.5Z"/><path class="accent" d="m88.2 91.2 13.2 25.4c1.1 2.1 3.7 3 5.8 1.9l11.8-6c2.4-1.2 3.1-4.3 1.5-6.4l-17.1-21.4-15.2 6.5Z"/></g></svg></div>
      </article>
      <article id="license-card" class="license-card">
        <div class="license-main"><p class="eyebrow">License</p><p class="license-line"><span class="license-dot" aria-hidden="true"></span><span id="license-summary">Checking your license…</span></p><p id="license-device"></p></div>
        <div class="license-check" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="m5 12 4.1 4.1L19 6.5"/></svg></div>
      </article>
    </section>
    <nav class="bottom-nav" aria-label="Popup navigation">
      <button class="nav-item active" id="nav-home-btn"><svg viewBox="0 0 24 24"><path d="m3 10 9-7 9 7v10a1 1 0 0 1-1 1h-5v-7H9v7H4a1 1 0 0 1-1-1V10Z"/></svg><span>Home</span></button>

    <a class="brand-credit" href="https://oddbirds.dev" target="_blank" rel="noopener">Developed by <strong>oddbirds.dev</strong></a>
