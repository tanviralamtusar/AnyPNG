<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="../styles/global.css">
  <link rel="stylesheet" href="../styles/dashboard.css">
</head>
<body class="animate-fade-in">
  <main class="popup-shell">
    <header class="app-header"><div class="logo-container"><img src="../icons/Anypng.png" alt="RightMate logo" class="logo"><h1>Right<span>Mate</span></h1></div></header>
    <div id="error-msg" role="alert"></div>
    <section id="dashboard-view" class="view-container">
      <a id="update-banner" class="update-banner hidden" target="_blank" rel="noopener"><span class="update-icon">↑</span><span><strong id="update-title">Update available</strong><span id="update-detail"></span></span></a>
      <article class="quick-start-card">
        <div class="quick-copy"><p class="eyebrow">Quick start</p><h2>Use the RightMate <span>right-click menu</span></h2><p>Convert, upscale or enhance images and videos directly from any website.</p></div>
        <div class="cursor-illustration" aria-hidden="true"><svg viewBox="0 0 120 120" fill="none"><circle cx="60" cy="60" r="50"/><path d="M38 27 79 59 61 65 80 91 66 99 47 73 36 88 38 27Z"/><path class="accent" d="m76 76 15 20-14 5-15-20 14-5Z"/></svg></div>
      </article>
      <article id="license-card" class="license-card">
        <div class="license-main"><p class="eyebrow">License</p><p class="license-line"><span class="license-dot" aria-hidden="true"></span><span id="license-summary">Checking your license…</span></p><p id="license-device"></p></div>
        <div class="license-check" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="m5 12 4.1 4.1L19 6.5"/></svg></div>
      </article>
    </section>
    <nav class="bottom-nav" aria-label="Popup navigation">
      <button class="nav-item active" id="nav-home-btn"><svg viewBox="0 0 24 24"><path d="m3 10 9-7 9 7v10a1 1 0 0 1-1 1h-5v-7H9v7H4a1 1 0 0 1-1-1V10Z"/></svg><span>Home</span></button>
      <button class="nav-item" id="nav-settings-btn"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .34 1.88l.06.06-2.1 2.1-.06-.06A1.7 1.7 0 0 0 15.76 18a1.7 1.7 0 0 0-1.02 1.55v.1h-3v-.1A1.7 1.7 0 0 0 10.72 18a1.7 1.7 0 0 0-1.88.34l-.06.06-2.1-2.1.06-.06A1.7 1.7 0 0 0 7.08 14.4 1.7 1.7 0 0 0 5.55 13.4h-.1v-3h.1A1.7 1.7 0 0 0 7.08 9.38a1.7 1.7 0 0 0-.34-1.88l-.06-.06 2.1-2.1.06.06A1.7 1.7 0 0 0 10.72 5a1.7 1.7 0 0 0 1.02-1.55v-.1h3v.1A1.7 1.7 0 0 0 15.76 5a1.7 1.7 0 0 0 1.88-.34l.06-.06 2.1 2.1-.06.06a1.7 1.7 0 0 0-.34 1.88 1.7 1.7 0 0 0 1.53 1.02h.1v3h-.1A1.7 1.7 0 0 0 19.4 15Z"/></svg><span>Settings</span></button>
      <button class="nav-item" id="logout-btn"><svg viewBox="0 0 24 24"><path d="M10 17l5-5-5-5M15 12H3"/><path d="M13 4h6a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2h-6"/></svg><span>Logout</span></button>
    </nav>
    <a class="brand-credit" href="https://oddbirds.dev" target="_blank" rel="noopener">Developed by <strong>oddbirds.dev</strong></a>
  </main>
  <script src="../scripts/license.js"></script><script src="../scripts/update.js"></script><script src="../scripts/dashboard.js"></script>
</body>
</html>
