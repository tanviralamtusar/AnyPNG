<!-- 
  Icon Generator — Run this file in any browser to generate icons.
  Click the download links to save each icon.
-->
<!DOCTYPE html>
<html>

<head>
    <title>Icon Generator</title>
</head>

<body>
    <h2>Pro Image Tools — Icon Generator</h2>
    <p>Right-click each image below and "Save image as..." to the icons/ folder.</p>
    <div id="output" style="display:flex;gap:24px;margin-top:20px;"></div>
    <script>
        const sizes = [16, 48, 128];

        function drawIcon(size) {
            const canvas = document.createElement('canvas');
            canvas.width = size;
            canvas.height = size;
            const ctx = canvas.getContext('2d');
            const s = size;

            // Background gradient
            const grad = ctx.createLinearGradient(0, 0, s, s);
            grad.addColorStop(0, '#6366f1');
            grad.addColorStop(1, '#a855f7');

            // Rounded rect
            const r = s * 0.2;
            ctx.beginPath();
            ctx.moveTo(r, 0);
            ctx.lineTo(s - r, 0);
            ctx.quadraticCurveTo(s, 0, s, r);
            ctx.lineTo(s, s - r);
            ctx.quadraticCurveTo(s, s, s - r, s);
            ctx.lineTo(r, s);
            ctx.quadraticCurveTo(0, s, 0, s - r);
            ctx.lineTo(0, r);
            ctx.quadraticCurveTo(0, 0, r, 0);
            ctx.closePath();
            ctx.fillStyle = grad;
            ctx.fill();

            // Mountain / landscape icon
            ctx.fillStyle = 'rgba(255,255,255,0.9)';
            ctx.beginPath();
            ctx.moveTo(s * 0.15, s * 0.72);
            ctx.lineTo(s * 0.35, s * 0.42);
            ctx.lineTo(s * 0.50, s * 0.58);
            ctx.lineTo(s * 0.62, s * 0.45);
            ctx.lineTo(s * 0.85, s * 0.72);
            ctx.closePath();
            ctx.fill();

            // Sun circle
            ctx.beginPath();
            ctx.arc(s * 0.70, s * 0.30, s * 0.09, 0, Math.PI * 2);
            ctx.fill();

            // Sparkle rays (upscale hint)
            ctx.strokeStyle = 'rgba(255,255,255,0.7)';
            ctx.lineWidth = Math.max(1, s * 0.03);
            ctx.lineCap = 'round';
            const cx = s * 0.70, cy = s * 0.30, rl = s * 0.15;
            const angles = [-Math.PI / 4, 0, Math.PI / 4];
            angles.forEach(a => {
                ctx.beginPath();
                ctx.moveTo(cx + Math.cos(a) * s * 0.12, cy + Math.sin(a) * s * 0.12);
                ctx.lineTo(cx + Math.cos(a) * rl, cy + Math.sin(a) * rl);
                ctx.stroke();
            });

            return canvas;
        }

        const output = document.getElementById('output');

        sizes.forEach(size => {
            const canvas = drawIcon(size);
            const div = document.createElement('div');
            div.style.textAlign = 'center';

            const img = new Image();
            img.src = canvas.toDataURL('image/png');
            img.style.border = '1px solid #ccc';
            img.style.imageRendering = 'pixelated';
            img.style.width = Math.max(size, 64) + 'px';
            img.style.height = Math.max(size, 64) + 'px';

            const link = document.createElement('a');
            link.href = canvas.toDataURL('image/png');
            link.download = `icon${size}.png`;
            link.textContent = `icon${size}.png`;
            link.style.display = 'block';
            link.style.marginTop = '8px';

            div.appendChild(img);
            div.appendChild(link);
            output.appendChild(div);
        });
    </script>
</body>

</html>
