<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="../styles/global.css">
    <link rel="stylesheet" href="../styles/auth.css">
</head>
<body class="animate-fade-in">
    <div class="auth-container">

        <div class="logo-wrapper">
            <img src="../icons/Anypng.png" alt="AnyPNG Logo" style="width: 48px; height: 48px; margin-bottom: 1rem;">
            <h1>AnyPNG</h1>
        </div>

        <div class="glass-effect auth-card">
            <p style="text-align: center; color: var(--text-muted); font-size: 13px; margin-bottom: 20px;">
                Enter your email and we'll send you a link to reset your password.
            </p>

            <div class="input-container">
                <input type="email" id="email" placeholder="Email Address" required autocomplete="email">
                <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path>
                    <polyline points="22,6 12,13 2,6"></polyline>
                </svg>
            </div>

            <div id="error-msg" class="error-message"></div>
            <div id="success-msg" class="success-message"></div>

            <button id="reset-btn" class="auth-btn">
                <span>Send Reset Link</span>
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M22 2L11 13M22 2l-7 20-4-9-9-4 20-7z"/>
                </svg>
            </button>

            <a href="login.html" class="switch-link">
                Remembered it? <span>Back to login</span>
            </a>
        </div>
    </div>

    <script src="../scripts/forgot-password.js"></script>
</body>
</html>
