<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="../styles/global.css">
    <link rel="stylesheet" href="../styles/auth.css">
</head>
<body class="animate-fade-in">
    <div class="auth-container">

        <div class="logo-wrapper">
            <img src="../icons/Anypng.png" alt="RightMate Logo" style="width: 48px; height: 48px; margin-bottom: 1rem;">
            <h1>RightMate</h1>
        </div>

        <div class="glass-effect auth-card">
            <div id="email-step">
                <p class="step-hint">
                    Enter your email and we'll send you a code to reset your password.
                </p>

                <div class="input-container">
                    <input type="email" id="email" placeholder="Email Address" required autocomplete="email">
                    <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path>
                        <polyline points="22,6 12,13 2,6"></polyline>
                    </svg>
                </div>

                <button id="reset-btn" class="auth-btn">
                    <span>Send Reset Code</span>
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M22 2L11 13M22 2l-7 20-4-9-9-4 20-7z"/>
                    </svg>
                </button>
            </div>

            <div id="code-step" class="hidden">
                <p class="step-hint">
                    If an account exists for<br><strong id="code-email"></strong><br>a reset code is on its way.
                </p>

                <div class="input-container">
                    <input type="text" id="otp" class="otp-input" placeholder="000000" inputmode="numeric" autocomplete="one-time-code" maxlength="6">
                </div>

                <div class="input-container">
                    <input type="password" id="new-password" placeholder="New Password" autocomplete="new-password">
                    <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                        <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
                    </svg>
                </div>

                <button id="set-password-btn" class="auth-btn">
                    <span>Set New Password</span>
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <polyline points="20 6 9 17 4 12"></polyline>
                    </svg>
                </button>

                <p class="switch-link">
                    Didn't get it? <button id="resend-btn" class="link-btn" type="button">Resend code</button>
                </p>
            </div>

            <div id="error-msg" class="error-message"></div>
            <div id="success-msg" class="success-message"></div>

            <a href="login.html" class="switch-link">
                Remembered it? <span>Back to login</span>
            </a>
        </div>

        <a class="brand-credit" href="https://oddbirds.dev" target="_blank" rel="noopener">Developed by <strong>oddbirds.dev</strong></a>
    </div>

    <script src="../scripts/forgot-password.js"></script>
</body>
</html>
