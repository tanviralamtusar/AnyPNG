name: Package extension

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Read extension version
        id: manifest
        shell: bash
        run: |
          version=$(jq -r '.version' extension/manifest.json)
          if [[ -z "$version" || "$version" == "null" ]]; then
            echo "Could not read extension version from extension/manifest.json" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Create versioned ZIP
        env:
          VERSION: ${{ steps.manifest.outputs.version }}
        run: |
          mkdir -p dist
          (
            cd extension
            zip -qr "../dist/RightMate-v${VERSION}.zip" .
          )

      - name: Upload extension ZIP
        uses: actions/upload-artifact@v4
        with:
          name: RightMate-v${{ steps.manifest.outputs.version }}
          path: dist/RightMate-v${{ steps.manifest.outputs.version }}.zip
          if-no-files-found: error

      - name: Create GitHub release
        if: github.event_name != 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.manifest.outputs.version }}
          ZIP_PATH: dist/RightMate-v${{ steps.manifest.outputs.version }}.zip
        run: |
          tag="v${VERSION}"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release $tag already exists; nothing to publish."
          else
            gh release create "$tag" "$ZIP_PATH" \
              --target "$GITHUB_SHA" \
              --title "RightMate $tag" \
              --generate-notes
          fi
