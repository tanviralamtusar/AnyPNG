name: Package extension

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Read extension version
        id: manifest
        shell: bash
        run: |
          version=$(jq -r '.version' extension/manifest.json)
          if [[ -z "$version" || "$version" == "null" ]]; then
            echo "Could not read extension version from extension/manifest.json" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Create versioned ZIP
        env:
          VERSION: ${{ steps.manifest.outputs.version }}
        run: |
          mkdir -p dist
          (
            cd extension
            zip -qr "../dist/AnyPNG-v${VERSION}.zip" .
          )

      - name: Upload extension ZIP
        uses: actions/upload-artifact@v4
        with:
          name: AnyPNG-v${{ steps.manifest.outputs.version }}
          path: dist/AnyPNG-v${{ steps.manifest.outputs.version }}.zip
          if-no-files-found: error