<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>RightMate Licenses</title>
<style>
  :root {
    --bg: #0c0c11; --surface: #15161d; --surface-2: #1c1e27; --border: #2a2c38;
    --text: #f5f6fa; --muted: #8b8d9c; --primary: #3b82f6; --danger: #f43f5e;
    --success: #10b981; --warn: #f59e0b;
  }
  @media (prefers-color-scheme: light) {
    :root {
      --bg: #f6f8fc; --surface: #fff; --surface-2: #eef2f8; --border: #dbe2ec;
      --text: #0f172a; --muted: #64748b;
    }
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg); color: var(--text); min-height: 100vh; padding: 24px 16px;
    font: 14px/1.5 -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  }
  .wrap { max-width: 1180px; margin: 0 auto; }
  header { display: flex; align-items: baseline; gap: 12px; margin-bottom: 20px; flex-wrap: wrap; }
  h1 { font-size: 20px; font-weight: 700; }
  header .sub { color: var(--muted); font-size: 13px; }
  header .spacer { flex: 1; }
  .card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 16px; margin-bottom: 16px; }
  .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  input, select, button { font: inherit; border-radius: 8px; border: 1px solid var(--border); }
  input, select { background: var(--surface-2); color: var(--text); padding: 9px 11px; }
  input:focus, select:focus { outline: 2px solid var(--primary); outline-offset: -1px; }
  input[type=search] { flex: 1; min-width: 220px; }
  button { background: var(--surface-2); color: var(--text); padding: 9px 14px; cursor: pointer; font-weight: 500; }
  button:hover:not(:disabled) { border-color: var(--muted); }
  button:disabled { opacity: .5; cursor: not-allowed; }
  button.primary { background: var(--primary); border-color: var(--primary); color: #fff; }
  button.danger { background: transparent; border-color: var(--danger); color: var(--danger); }
  button.small { padding: 5px 9px; font-size: 12px; }
  table { width: 100%; border-collapse: collapse; }
  th, td { text-align: left; padding: 9px 10px; border-bottom: 1px solid var(--border); vertical-align: top; }
  th { color: var(--muted); font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: .04em; }
  tbody tr:hover { background: var(--surface-2); }
  code { font-family: ui-monospace, 'SF Mono', Menlo, monospace; font-size: 13px; }
  .pill { display: inline-block; padding: 2px 8px; border-radius: 999px; font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: .04em; }
  .pill.unused  { background: rgba(139,141,156,.18); color: var(--muted); }
  .pill.active  { background: rgba(16,185,129,.16); color: var(--success); }
  .pill.revoked { background: rgba(244,63,94,.16); color: var(--danger); }
  .pill.banned  { background: rgba(245,158,11,.16); color: var(--warn); }
  .muted { color: var(--muted); }
  .nowrap { white-space: nowrap; }
  .keys { background: var(--surface-2); border-radius: 8px; padding: 12px; margin-top: 12px; }
  .keys code { display: block; padding: 2px 0; }
  .msg { padding: 10px 12px; border-radius: 8px; margin-bottom: 12px; display: none; }
  .msg.show { display: block; }
  .msg.err { background: rgba(244,63,94,.12); color: var(--danger); }
  .msg.ok  { background: rgba(16,185,129,.12); color: var(--success); }
  .hidden { display: none !important; }
  .gate { max-width: 420px; margin: 12vh auto; }
  .gate p { color: var(--muted); margin: 6px 0 14px; }
  details.events { margin-top: 6px; }
  details.events summary { cursor: pointer; color: var(--muted); font-size: 12px; }
  details.events table { margin-top: 6px; font-size: 12px; }
  .table-scroll { overflow-x: auto; }
  .tabs { display: flex; gap: 4px; margin-bottom: 16px; }
  .tabs button { background: transparent; border-color: transparent; color: var(--muted); }
  .tabs button[aria-selected="true"] { background: var(--surface); border-color: var(--border); color: var(--text); }
  @media (max-width: 720px) { body { padding: 12px 8px; } th, td { padding: 7px 6px; font-size: 13px; } }
</style>
</head>
<body>
<div class="wrap">

  <div id="gate" class="gate card">
    <h1>RightMate Licenses</h1>
    <p>Paste the admin token (the backend's <code>SECRET_TOKEN</code>). It is kept in this tab only.</p>
    <div class="row">
      <input type="password" id="token" placeholder="Admin token" style="flex:1" autocomplete="off">
      <button class="primary" id="unlock">Unlock</button>
    </div>
    <div id="gate-msg" class="msg err" style="margin-top:12px"></div>
  </div>

  <div id="app" class="hidden">
    <header>
      <h1>RightMate Licenses</h1>
      <span class="sub" id="count"></span>
      <span class="spacer"></span>
      <button class="small" id="lock">Lock</button>
    </header>

    <div id="msg" class="msg"></div>

    <div class="tabs" role="tablist">
      <button id="tab-licenses" role="tab" aria-selected="true">Licenses</button>
      <button id="tab-users" role="tab" aria-selected="false">Users</button>
    </div>

    <div class="card" data-view="licenses">
      <div class="row">
        <strong style="width:100%">Create keys</strong>
        <input type="number" id="mint-count" value="1" min="1" max="100" style="width:90px" title="How many keys">
        <input type="text" id="mint-email" placeholder="Buyer email (optional)">
        <input type="text" id="mint-order" placeholder="Order / note (optional, 1 key only)">
        <button class="primary" id="mint">Generate</button>
      </div>
      <div id="minted" class="keys hidden"></div>
    </div>

    <div class="card">
      <div class="row">
        <input type="search" id="q" placeholder="Search…">
        <button id="search">Search</button>
        <button id="refresh">Refresh</button>
      </div>
    </div>

    <div class="card table-scroll">
      <table data-view="licenses">
        <thead>
          <tr>
            <th>Key</th><th>Status</th><th>Account</th><th>Device</th>
            <th class="nowrap">Last seen</th><th>Actions</th>
          </tr>
        </thead>
        <tbody id="rows"><tr><td colspan="6" class="muted">Loading…</td></tr></tbody>
      </table>

      <table data-view="users" class="hidden">
        <thead>
          <tr>
            <th>Account</th><th>License</th>
            <th class="nowrap">Signed up</th><th class="nowrap">Last sign-in</th><th>Actions</th>
          </tr>
        </thead>
        <tbody id="user-rows"><tr><td colspan="5" class="muted">Loading…</td></tr></tbody>
      </table>

      <div class="row" style="margin-top:12px">
        <button id="prev" class="small">Previous</button>
        <button id="next" class="small">Next</button>
        <span class="muted" id="page-info"></span>
      </div>
    </div>
  </div>
</div>

<script>
const PAGE_SIZE = 25;
const $ = (id) => document.getElementById(id);
let token = sessionStorage.getItem('rmAdminToken') || '';
let offset = 0;
let total = 0;
let view = 'licenses';   // 'licenses' | 'users'

function flash(text, ok) {
  const el = $('msg');
  el.textContent = text;
  el.className = 'msg show ' + (ok ? 'ok' : 'err');
  clearTimeout(flash.timer);
  flash.timer = setTimeout(() => { el.className = 'msg'; }, 6000);
}

async function api(path, options = {}) {
  const res = await fetch(path, {
    ...options,
    headers: {
      'Authorization': 'Bearer ' + token,
      ...(options.body ? { 'Content-Type': 'application/json' } : {}),
    },
  });
  let data = null;
  try { data = await res.json(); } catch { /* empty body */ }
  if (res.status === 401) {
    lock();
    throw new Error('That token was rejected.');
  }
  if (!res.ok) {
    const detail = data && data.detail;
    throw new Error((detail && detail.message) || (typeof detail === 'string' ? detail : 'Request failed (' + res.status + ').'));
  }
  return data;
}

function unlock() {
  sessionStorage.setItem('rmAdminToken', token);
  $('gate').classList.add('hidden');
  $('app').classList.remove('hidden');
  setView('licenses');
}

function lock() {
  token = '';
  sessionStorage.removeItem('rmAdminToken');
  $('app').classList.add('hidden');
  $('gate').classList.remove('hidden');
}

$('unlock').onclick = async () => {
  token = $('token').value.trim();
  if (!token) return;
  $('unlock').disabled = true;
  try {
    await api('/license/admin/licenses?limit=1');
    $('gate-msg').className = 'msg err';
    unlock();
  } catch (error) {
    $('gate-msg').textContent = error.message;
    $('gate-msg').className = 'msg err show';
  }
  $('unlock').disabled = false;
};
$('token').addEventListener('keydown', (e) => { if (e.key === 'Enter') $('unlock').click(); });
$('lock').onclick = lock;

function fmtDate(value) {
  if (!value) return '—';
  const d = new Date(value);
  return isNaN(d) ? '—' : d.toLocaleString(undefined, { dateStyle: 'medium', timeStyle: 'short' });
}

function escapeHtml(value) {
  return String(value == null ? '' : value).replace(/[&<>"']/g, (c) =>
    ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}

function setView(next) {
  view = next;
  offset = 0;
  $('tab-licenses').setAttribute('aria-selected', String(view === 'licenses'));
  $('tab-users').setAttribute('aria-selected', String(view === 'users'));
  document.querySelectorAll('[data-view]').forEach((el) => {
    el.classList.toggle('hidden', el.dataset.view !== view);
  });
  $('q').value = '';
  $('q').placeholder = view === 'licenses'
    ? 'Search key, email, order or device…'
    : 'Search email, name or key…';
  load();
}

$('tab-licenses').onclick = () => setView('licenses');
$('tab-users').onclick = () => setView('users');

function userRowHtml(row) {
  const license = row.license_key
    ? '<code>' + escapeHtml(row.license_key) + '</code>'
      + ' <span class="pill ' + escapeHtml(row.license_status) + '">' + escapeHtml(row.license_status) + '</span>'
      + (row.license_device ? '<div class="muted" style="font-size:12px">' + escapeHtml(row.license_device) + '</div>' : '')
    : '<span class="muted">none</span>';
  const name = row.full_name ? '<div class="muted" style="font-size:12px">' + escapeHtml(row.full_name) + '</div>' : '';
  const unconfirmed = row.email_confirmed_at ? '' : ' <span class="pill unused">unconfirmed</span>';

  return '<tr data-user="' + escapeHtml(row.id) + '">'
    + '<td>' + escapeHtml(row.email || '—') + unconfirmed
      + (row.banned ? ' <span class="pill banned">banned</span>' : '') + name + '</td>'
    + '<td>' + license + '</td>'
    + '<td class="nowrap muted">' + fmtDate(row.created_at) + '</td>'
    + '<td class="nowrap muted">' + fmtDate(row.last_sign_in_at) + '</td>'
    + '<td class="nowrap">'
      + (row.license_key ? '<button class="small" data-act="find-key">View license</button> ' : '')
      + '<button class="small" data-act="ban">' + (row.banned ? 'Unban' : 'Ban') + '</button>'
    + '</td>'
    + '</tr>';
}

function rowHtml(row) {
  const account = row.account_email || row.buyer_email || '';
  const device = row.device_label
    ? escapeHtml(row.device_label) + '<div class="muted" style="font-size:12px">since ' + fmtDate(row.device_bound_at) + '</div>'
    : '<span class="muted">not activated</span>';
  const badges = '<span class="pill ' + escapeHtml(row.status) + '">' + escapeHtml(row.status) + '</span>'
    + (row.account_banned ? ' <span class="pill banned">banned</span>' : '');
  const hasAccount = !!row.user_id;

  return '<tr data-key="' + escapeHtml(row.key) + '" data-user="' + escapeHtml(row.user_id || '') + '">'
    + '<td class="nowrap"><code>' + escapeHtml(row.key) + '</code>'
      + (row.order_id ? '<div class="muted" style="font-size:12px">' + escapeHtml(row.order_id) + '</div>' : '')
      + '<details class="events"><summary>History</summary><div data-events><span class="muted">Loading…</span></div></details>'
    + '</td>'
    + '<td class="nowrap">' + badges + '<div class="muted" style="font-size:12px">' + row.switch_count + ' move(s)</div></td>'
    + '<td>' + (account ? escapeHtml(account) : '<span class="muted">unclaimed</span>') + '</td>'
    + '<td>' + device + '</td>'
    + '<td class="nowrap muted">' + fmtDate(row.last_seen_at) + '</td>'
    + '<td class="nowrap">'
      + '<button class="small" data-act="release"' + (row.status === 'revoked' ? ' disabled' : '') + '>Unbind device</button> '
      + '<button class="small danger" data-act="revoke"' + (row.status === 'revoked' ? ' disabled' : '') + '>Revoke key</button> '
      + '<button class="small" data-act="ban"' + (hasAccount ? '' : ' disabled') + '>'
        + (row.account_banned ? 'Unban account' : 'Ban account') + '</button>'
    + '</td>'
    + '</tr>';
}

async function load() {
  const users = view === 'users';
  const body = $(users ? 'user-rows' : 'rows');
  const span = users ? 5 : 6;
  const q = encodeURIComponent($('q').value.trim());
  body.innerHTML = '<tr><td colspan="' + span + '" class="muted">Loading…</td></tr>';
  try {
    const path = users ? '/license/admin/users' : '/license/admin/licenses';
    const data = await api(path + '?q=' + q + '&limit=' + PAGE_SIZE + '&offset=' + offset);
    total = data.total || 0;
    const noun = users ? 'account' : 'license';
    $('count').textContent = total + ' ' + noun + (total === 1 ? '' : 's');
    body.innerHTML = data.rows.length
      ? data.rows.map(users ? userRowHtml : rowHtml).join('')
      : '<tr><td colspan="' + span + '" class="muted">Nothing matches.</td></tr>';
    const from = total ? offset + 1 : 0;
    $('page-info').textContent = from + '–' + Math.min(offset + PAGE_SIZE, total) + ' of ' + total;
    $('prev').disabled = offset === 0;
    $('next').disabled = offset + PAGE_SIZE >= total;
  } catch (error) {
    body.innerHTML = '<tr><td colspan="' + span + '" class="muted">' + escapeHtml(error.message) + '</td></tr>';
  }
}

$('search').onclick = () => { offset = 0; load(); };
$('refresh').onclick = load;
$('q').addEventListener('keydown', (e) => { if (e.key === 'Enter') $('search').click(); });
$('prev').onclick = () => { offset = Math.max(0, offset - PAGE_SIZE); load(); };
$('next').onclick = () => { offset += PAGE_SIZE; load(); };

$('mint').onclick = async () => {
  const count = Math.max(1, Math.min(Number($('mint-count').value) || 1, 100));
  $('mint').disabled = true;
  try {
    const data = await api('/license/admin/mint', {
      method: 'POST',
      body: JSON.stringify({
        count,
        provider: 'manual',
        order_id: count === 1 ? ($('mint-order').value.trim() || null) : null,
        email: $('mint-email').value.trim() || null,
      }),
    });
    const box = $('minted');
    box.classList.remove('hidden');
    box.innerHTML = '<div class="muted" style="margin-bottom:6px">'
      + data.keys.length + ' key(s) created — copy them now:</div>'
      + data.keys.map((k) => '<code>' + escapeHtml(k) + '</code>').join('');
    flash('Created ' + data.keys.length + ' key(s).', true);
    offset = 0;
    load();
  } catch (error) {
    flash(error.message, false);
  }
  $('mint').disabled = false;
};

async function loadEvents(tr) {
  const box = tr.querySelector('[data-events]');
  if (box.dataset.loaded) return;
  try {
    const data = await api('/license/admin/events?key=' + encodeURIComponent(tr.dataset.key));
    box.dataset.loaded = '1';
    box.innerHTML = data.events.length
      ? '<table>' + data.events.map((e) =>
          '<tr><td class="nowrap">' + escapeHtml(e.event) + '</td>'
          + '<td class="muted">' + escapeHtml(e.device_label || e.device_id || '') + '</td>'
          + '<td class="nowrap muted">' + fmtDate(e.created_at) + '</td></tr>').join('') + '</table>'
      : '<span class="muted">No history.</span>';
  } catch (error) {
    box.innerHTML = '<span class="muted">' + escapeHtml(error.message) + '</span>';
  }
}

$('rows').addEventListener('toggle', (event) => {
  const details = event.target;
  if (details.tagName === 'DETAILS' && details.open) loadEvents(details.closest('tr'));
}, true);

$('rows').addEventListener('click', async (event) => {
  const button = event.target.closest('button[data-act]');
  if (!button) return;
  const tr = button.closest('tr');
  const key = tr.dataset.key;
  const act = button.dataset.act;

  if (act === 'revoke' && !confirm('Revoke ' + key + ' permanently?\n\nThe user loses access within a day and the key can never be reactivated from here.')) return;
  if (act === 'ban' && !confirm(button.textContent.trim() + ' for the account holding ' + key + '?')) return;

  button.disabled = true;
  try {
    if (act === 'release') {
      await api('/license/admin/release', { method: 'POST', body: JSON.stringify({ key }) });
      flash('Device unbound; the user can activate again right away.', true);
    } else if (act === 'revoke') {
      await api('/license/admin/revoke', { method: 'POST', body: JSON.stringify({ key }) });
      flash('Key revoked.', true);
    } else {
      const banning = button.textContent.trim().startsWith('Ban');
      await api('/license/admin/ban', { method: 'POST', body: JSON.stringify({ user_id: tr.dataset.user, banned: banning }) });
      flash(banning ? 'Account banned from signing in.' : 'Account unbanned.', true);
    }
    load();
  } catch (error) {
    flash(error.message, false);
    button.disabled = false;
  }
});

$('user-rows').addEventListener('click', async (event) => {
  const button = event.target.closest('button[data-act]');
  if (!button) return;
  const tr = button.closest('tr');
  const userId = tr.dataset.user;
  const act = button.dataset.act;

  if (act === 'find-key') {
    const key = tr.querySelector('code').textContent;
    setView('licenses');
    $('q').value = key;
    $('search').click();
    return;
  }
  if (act === 'ban' && !confirm(button.textContent.trim() + ' ' + tr.querySelector('td').textContent.trim() + '?')) return;

  button.disabled = true;
  try {
    const banning = button.textContent.trim() === 'Ban';
    await api('/license/admin/ban', { method: 'POST', body: JSON.stringify({ user_id: userId, banned: banning }) });
    flash(banning ? 'Account banned from signing in.' : 'Account unbanned.', true);
    load();
  } catch (error) {
    flash(error.message, false);
    button.disabled = false;
  }
});

if (token) unlock();
</script>
</body>
</html>
